  retry_policy: no-blind-retry
- code: RATE_LIMITED
  http_status: 429
  meaning: 超出批准限流策略
  retry_policy: honor-retry-after
- code: INTERNAL_ERROR
  http_status: 500
  meaning: 服务端异常
  retry_policy: read-authoritative-state-first
- code: SERVICE_UNAVAILABLE
  http_status: 503

      type: string
      pattern: ^s[0-9]{7}$
      minLength: 8
      maxLength: 8
      description: 候选商家UID；须DEC-13-UID签批
    MerchantApplicationStatus:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
      - NEEDS_INFO
      - APPROVED
      - REJECTED
    BusinessDayStatus:
      type: string
      enum:
      - OPEN
      - CLOSING
      - CLOSED
      - REOPENED_REVIEW
    BusinessDayRequestStatus:
      type: string
      enum:
      - REQUESTED
      - APPROVED
      - REJECTED
      - EXECUTING
      - EXECUTED
      - FAILED
      - EXPIRED
    BusinessDayAction:
      type: string
      enum:
      - CLOSE
      - REOPEN_REVIEW
      - RECLOSE
    BusinessDay:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        bookId:
          $ref: '#/components/schemas/Id'
        businessDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/BusinessDayStatus'
        version: &id002
          type: integer
          minimum: 1
          maximum: 100000000
        reportRevision: *id002
        cutoffAt: &id003
          type: string
          format: date-time
        highWatermark:
          type: string
          pattern: ^[0-9]{1,20}$
        snapshotHash:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
        environment:
          $ref: '#/components/schemas/Environment'
      required:
      - id
      - bookId
      - businessDate
      - status
      - version
      - reportRevision
      - cutoffAt
      - highWatermark
      - snapshotHash
      - closedAt
      - environment
      examples:
      - id: '501'
        bookId: '201'
        businessDate: '2026-09-29'
        status: CLOSED
        version: 3
        reportRevision: 1
        cutoffAt: '2026-09-29T16:00:00Z'
        highWatermark: '900'
        snapshotHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        closedAt: '2026-09-29T16:10:00Z'
        environment: SIMULATION
    BusinessDayRequestCreate:
      type: object
      additionalProperties: false
      properties:
        expectedDayVersion: *id002
        reason:
          type: string
          minLength: 10
          maxLength: 1000
        evidenceIds:
          allOf:
          - $ref: '#/components/schemas/EvidenceIds'
          minItems: 1
        reconciliationIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
          maxItems: 20
          uniqueItems: true
        impactSummary:
          type: string
          minLength: 10
          maxLength: 2000
      required:
      - expectedDayVersion
      - reason
      - evidenceIds
      - reconciliationIds
      - impactSummary
      examples:
      - expectedDayVersion: 2
        reason: 模拟业务日对账已经完成，申请关闭并保留快照
        evidenceIds:
        - '301'
        reconciliationIds:
        - '401'
        impactSummary: 无未解决金额差异，原始业务记录与投影一致
    BusinessDayRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        dayId:
          $ref: '#/components/schemas/Id'
        action:
          $ref: '#/components/schemas/BusinessDayAction'
        status:
          $ref: '#/components/schemas/BusinessDayRequestStatus'
        makerId:
          $ref: '#/components/schemas/Id'
        checkerId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        version: *id002
        reason:
          type: string
          maxLength: 1000
        expiresAt: *id003
        environment:
          $ref: '#/components/schemas/Environment'
      required:
      - id
      - dayId
      - action
      - status
      - makerId
      - checkerId
      - version
      - reason
      - expiresAt
      - environment

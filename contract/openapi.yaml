  retry_policy: read-authoritative-state-first
- code: DAY_VERSION_CONFLICT
  http_status: 409
  meaning: 业务日版本已变化
  retry_policy: read-authoritative-state-first
- code: UNRESOLVED_RECONCILIATION
  http_status: 409
  meaning: 存在阻断对账差异
  retry_policy: read-authoritative-state-first
- code: SELF_REVIEW_DENIED
  http_status: 403

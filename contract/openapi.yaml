  retry_policy: no-blind-retry
- code: SCOPE_DENIED
  http_status: 403
  meaning: 对象范围或操作权限不足
  retry_policy: no-blind-retry
- code: RESOURCE_NOT_FOUND
  http_status: 404
  meaning: 对象不存在或不允许确认存在
  retry_policy: no-blind-retry
- code: IDEMPOTENCY_CONFLICT
  http_status: 409
  meaning: 同幂等键不同正文
  retry_policy: read-authoritative-state-first
- code: VERSION_CONFLICT
  http_status: 409
  meaning: 对象版本已变化
  retry_policy: read-authoritative-state-first
- code: STATE_CONFLICT
  http_status: 409
  meaning: 当前状态不能执行该动作
  retry_policy: read-authoritative-state-first
- code: LIMIT_UNAVAILABLE
  http_status: 409
  meaning: 额度或批准容量不足
  retry_policy: read-authoritative-state-first
- code: CREDENTIAL_EXPIRED
  http_status: 410

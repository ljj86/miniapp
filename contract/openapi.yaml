x-mock-signature:
  protocol: SIM-HMAC-1
  canonical: timestamp + LF + nonce + LF + raw_utf8_body + LF
  newlineByteHex: 0a
  bodyEncoding: UTF-8
  signature: Base64(HMAC-SHA256(keyForKeyId, canonical_bytes))
  clockSkewSeconds: 300
  nonceRetentionSeconds: 600
  sameNonceSameBody: respond only after revalidation and verified durable inbox match; return existing receipt,
    never apply twice
  sameNonceDifferentBody: reject
  sameEventDifferentBody: 409 CALLBACK_CONFLICT
  signedTimestampVsBusinessTime: transport timestamp must be fresh; occurredAt may be historical and is never rewritten
  sourceFile: technical/mock_signature.py
